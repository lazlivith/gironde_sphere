<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Songolo Fast-Food — Aperçu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body { font-family: 'Inter', sans-serif; background:#EDEAE3; }
  .font-display { font-family: 'Sora', sans-serif; }
  .phone { max-width: 400px; margin: 0 auto; min-height: 100vh; background:#FFF8F0; position:relative; overflow:hidden; }
  .no-scrollbar::-webkit-scrollbar{display:none;}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, createContext, useContext, useCallback } = React;

const ORANGE = "#FF6A3D";
const INK = "#181411";

const MENU = {
  brand: "Songolo Fast-Food",
  whatsappNumber: "242060000000",
  categories: [
    { id: "fastfood", label: "Fast-Food", icon: "🌮", items: [
      { id: "ff-tacos", name: "Tacos Standard", description: "Viande au choix, frites, sauce fromagère maison", price: 2500, type: "simple", emoji: "🌮" },
      { id: "ff-sandwich", name: "Sandwich Poulet Mayo", description: "Poulet grillé, crudités fraîches, mayonnaise", price: 2000, type: "simple", emoji: "🥪" },
    ]},
    { id: "douceurs", label: "Douceurs", icon: "🥞", items: [
      { id: "dc-crepe", name: "Crêpe Sucrée Simple", description: "Crêpe fine, sucre, un filet de citron", price: 1000, type: "simple", emoji: "🥞" },
    ]},
    { id: "jus", label: "Bar à Jus", icon: "🥤", items: [
      { id: "jus-mesure", name: "Jus sur Mesure", description: "Composez votre jus : 1 à 3 fruits au choix", type: "custom-juice", emoji: "🥤",
        sizes: [ { id: "moyen", label: "Moyenne", price: 1500 }, { id: "grande", label: "Grande", price: 2000 } ],
        fruits: ["Mangue","Avocat","Ananas","Gingembre","Passion","Banane"], minFruits: 1, maxFruits: 3 },
    ]},
  ],
  deliveryZones: [
    { id: "songolo", label: "Songolo", fee: 500 },
    { id: "centre-ville", label: "Centre-ville", fee: 1000 },
    { id: "total-marche", label: "Total / Grand Marché", fee: 1500 },
    { id: "autre", label: "Autre quartier", fee: 2000 },
  ],
};

const FCFA = (n) => `${n.toLocaleString("fr-FR")} FCFA`;
const allItems = MENU.categories.flatMap(c => c.items);

const CartContext = createContext(null);
function CartProvider({ children }) {
  const [lines, setLines] = useState([]);
  const addLine = useCallback((line) => setLines((p) => [...p, { ...line, lineId: Math.random().toString(36).slice(2), qty: line.qty || 1 }]), []);
  const updateQty = useCallback((id, qty) => setLines((p) => qty <= 0 ? p.filter(l => l.lineId !== id) : p.map(l => l.lineId === id ? { ...l, qty } : l)), []);
  const removeLine = useCallback((id) => setLines((p) => p.filter(l => l.lineId !== id)), []);
  const clearCart = useCallback(() => setLines([]), []);
  const subtotal = useMemo(() => lines.reduce((s, l) => s + l.unitPrice * l.qty, 0), [lines]);
  const itemCount = useMemo(() => lines.reduce((s, l) => s + l.qty, 0), [lines]);
  return <CartContext.Provider value={{ lines, addLine, updateQty, removeLine, clearCart, subtotal, itemCount }}>{children}</CartContext.Provider>;
}
const useCart = () => useContext(CartContext);

function sendOrderToWhatsApp({ lines, customer, subtotal }) {
  const zone = MENU.deliveryZones.find(z => z.id === customer.zoneId);
  const deliveryFee = zone ? zone.fee : 0;
  const total = subtotal + deliveryFee;
  const itemsBlock = lines.map(l => `• ${l.qty}x ${l.name}${l.meta ? ` (${l.meta})` : ""} (${FCFA(l.unitPrice * l.qty)})`).join("\n");
  const message = [
    `🔔 *NOUVELLE COMMANDE - ${MENU.brand.toUpperCase()}*`, "----------------------------------------",
    `👤 *Client :* ${customer.name}`, `📞 *Tél :* ${customer.phone}`, `📍 *Livraison :* ${zone ? zone.label : "-"}`, "",
    "🛒 *Détail de la commande :*", itemsBlock, "", "----------------------------------------",
    `💵 Sous-total : ${FCFA(subtotal)}`, `🛵 Livraison : ${FCFA(deliveryFee)}`, `💰 *TOTAL À PAYER : ${FCFA(total)}*`,
    "----------------------------------------", "_Merci pour votre confiance ! Préparez la monnaie._",
  ].join("\n");
  window.open(`https://wa.me/${MENU.whatsappNumber}?text=${encodeURIComponent(message)}`, "_blank");
}

function BackBtn({ onClick }) {
  return <button onClick={onClick} className="flex h-9 w-9 items-center justify-center rounded-full bg-white shadow-sm ring-1 ring-black/5 text-[15px]">←</button>;
}

function TopBar({ title, onBack, right }) {
  return (
    <div className="flex items-center justify-between px-5 pt-6 pb-2">
      <BackBtn onClick={onBack} />
      {title && <h2 className="font-display text-[15px] font-bold text-[#181411]">{title}</h2>}
      {right || <div className="w-9" />}
    </div>
  );
}

function Stepper({ qty, onChange, size }) {
  const s = size === "sm" ? "h-6 w-6 text-xs" : "h-8 w-8 text-sm";
  return (
    <div className="flex items-center gap-2">
      <button onClick={() => onChange(qty - 1)} className={`${s} flex items-center justify-center rounded-full font-bold text-white`} style={{background: ORANGE}}>−</button>
      <span className="w-4 text-center text-sm font-semibold text-[#181411]">{qty}</span>
      <button onClick={() => onChange(qty + 1)} className={`${s} flex items-center justify-center rounded-full font-bold text-white`} style={{background: ORANGE}}>+</button>
    </div>
  );
}

function Home({ onOpenItem, onOpenCart }) {
  const { itemCount, subtotal } = useCart();
  const [activeCat, setActiveCat] = useState(null);
  const shown = activeCat ? MENU.categories.find(c => c.id === activeCat).items : allItems;

  return (
    <div className="pb-24">
      <div className="flex items-center justify-between px-5 pt-6">
        <div>
          <p className="text-xs text-[#9A948C]">Bonjour 👋</p>
          <p className="flex items-center gap-1 font-display text-[15px] font-bold text-[#181411]">📍 Songolo, Pointe-Noire</p>
        </div>
        <div className="flex h-10 w-10 items-center justify-center rounded-full bg-white shadow-sm ring-1 ring-black/5">🔔</div>
      </div>

      <div className="mx-5 mt-4 flex items-center justify-between overflow-hidden rounded-2xl p-4" style={{background: ORANGE}}>
        <div>
          <p className="font-display text-[15px] font-bold leading-tight text-white">Faites-vous plaisir<br/>avec un Jus sur Mesure</p>
          <button onClick={() => setActiveCat("jus")} className="mt-3 rounded-full bg-[#181411] px-4 py-2 text-xs font-semibold text-white">Commander</button>
        </div>
        <div className="text-5xl">🥤</div>
      </div>

      <p className="mt-6 px-5 font-display text-[15px] font-bold text-[#181411]">Catégories</p>
      <div className="mt-3 flex gap-3 overflow-x-auto px-5 no-scrollbar">
        {MENU.categories.map(c => (
          <button key={c.id} onClick={() => setActiveCat(activeCat === c.id ? null : c.id)} className="flex flex-shrink-0 flex-col items-center gap-1.5">
            <div className="flex h-16 w-16 items-center justify-center rounded-2xl text-2xl bg-white" style={activeCat === c.id ? {boxShadow: `0 0 0 2px ${ORANGE}`} : {}}>{c.icon}</div>
            <span className="text-[11px] font-medium text-[#181411]">{c.label}</span>
          </button>
        ))}
      </div>

      <div className="mt-6 flex items-center justify-between px-5">
        <p className="font-display text-[15px] font-bold text-[#181411]">{activeCat ? MENU.categories.find(c=>c.id===activeCat).label : "Tous nos produits"}</p>
        {activeCat && <button onClick={() => setActiveCat(null)} className="text-xs font-medium" style={{color: ORANGE}}>Voir tout</button>}
      </div>

      <div className="mt-3 grid grid-cols-2 gap-3 px-5">
        {shown.map(item => (
          <button key={item.id} onClick={() => onOpenItem(item)} className="rounded-2xl bg-white p-2.5 text-left shadow-sm ring-1 ring-black/5">
            <div className="relative flex h-24 items-center justify-center rounded-xl text-4xl" style={{background: "#FFF1E9"}}>
              {item.emoji}
              <span className="absolute right-1.5 top-1.5 flex h-6 w-6 items-center justify-center rounded-full bg-white text-xs shadow">♡</span>
            </div>
            <p className="mt-2 truncate text-[13px] font-semibold text-[#181411]">{item.name}</p>
            <p className="mt-0.5 line-clamp-1 text-[11px] text-[#9A948C]">{item.description}</p>
            <div className="mt-1.5 flex items-center justify-between">
              <span className="font-display text-[13px] font-bold" style={{color: ORANGE}}>
                {item.type === "custom-juice" ? FCFA(item.sizes[0].price) : FCFA(item.price)}
              </span>
              <span className="flex h-6 w-6 items-center justify-center rounded-full text-xs font-bold text-white" style={{background: INK}}>+</span>
            </div>
          </button>
        ))}
      </div>

      {itemCount > 0 && (
        <button onClick={onOpenCart} className="fixed bottom-5 left-1/2 z-20 flex w-[calc(100%-40px)] max-w-[360px] -translate-x-1/2 items-center justify-between rounded-2xl px-5 py-4 text-white shadow-lg" style={{background: INK}}>
          <span className="flex items-center gap-2 text-sm font-semibold">
            <span className="flex h-6 w-6 items-center justify-center rounded-full text-xs" style={{background: ORANGE}}>{itemCount}</span>
            Voir la commande
          </span>
          <span className="font-display text-sm font-bold">{FCFA(subtotal)}</span>
        </button>
      )}
    </div>
  );
}

function Detail({ item, onBack, onAdded }) {
  const { addLine } = useCart();
  const [qty, setQty] = useState(1);
  const [sizeId, setSizeId] = useState(item.type === "custom-juice" ? item.sizes[0].id : null);
  const [fruits, setFruits] = useState([]);
  const isJuice = item.type === "custom-juice";
  const size = isJuice ? item.sizes.find(s => s.id === sizeId) : null;
  const unitPrice = isJuice ? size.price : item.price;
  const valid = !isJuice || (fruits.length >= item.minFruits && fruits.length <= item.maxFruits);

  const toggleFruit = (f) => setFruits(p => p.includes(f) ? p.filter(x => x !== f) : (p.length >= item.maxFruits ? p : [...p, f]));

  const handleAdd = () => {
    if (!valid) return;
    addLine({ name: isJuice ? `Jus Perso ${size.label}` : item.name, unitPrice, qty, meta: isJuice ? fruits.join(", ") : undefined });
    onAdded();
  };

  return (
    <div className="pb-28">
      <TopBar onBack={onBack} right={<span className="flex h-9 w-9 items-center justify-center rounded-full bg-white shadow-sm ring-1 ring-black/5">♡</span>} />
      <div className="mx-auto mt-4 flex h-52 w-52 items-center justify-center rounded-full text-8xl" style={{background: "#FFF1E9"}}>{item.emoji}</div>

      <div className="px-5 pt-6">
        <h1 className="font-display text-xl font-extrabold text-[#181411]">{item.name}</h1>
        <p className="mt-1 text-sm text-[#9A948C]">{item.description}</p>
        <p className="mt-3 font-display text-lg font-extrabold" style={{color: ORANGE}}>{FCFA(unitPrice)}</p>

        {isJuice && (
          <React.Fragment>
            <div className="mt-5">
              <p className="mb-2 text-xs font-bold uppercase tracking-wide text-[#9A948C]">Taille</p>
              <div className="flex gap-2">
                {item.sizes.map(s => (
                  <button key={s.id} onClick={() => setSizeId(s.id)} className="flex-1 rounded-xl border px-3 py-2.5 text-sm font-semibold transition"
                    style={sizeId === s.id ? {borderColor: ORANGE, background: "#FFF1E9", color: ORANGE} : {borderColor: "#EFEAE3", color: "#181411"}}>
                    {s.label} <span className="block text-xs font-normal opacity-70">{FCFA(s.price)}</span>
                  </button>
                ))}
              </div>
            </div>

            <div className="mt-5">
              <div className="mb-1 flex items-center justify-between">
                <p className="text-xs font-bold uppercase tracking-wide text-[#9A948C]">Ajouter des fruits</p>
                <span className="text-xs font-medium text-[#9A948C]">{fruits.length}/{item.maxFruits}</span>
              </div>
              <div className="divide-y divide-[#F1ECE4] rounded-2xl bg-white ring-1 ring-black/5">
                {item.fruits.map(f => {
                  const selected = fruits.includes(f);
                  return (
                    <button key={f} onClick={() => toggleFruit(f)} className="flex w-full items-center justify-between px-4 py-3">
                      <span className="text-sm font-medium text-[#181411]">{f}</span>
                      <span className="flex h-5 w-5 items-center justify-center rounded-full border-2" style={selected ? {borderColor: ORANGE, background: ORANGE} : {borderColor: "#E5DFD6"}}>
                        {selected && <span className="h-2 w-2 rounded-full bg-white" />}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>
          </React.Fragment>
        )}

        <div className="mt-6 flex items-center justify-between">
          <p className="text-xs font-bold uppercase tracking-wide text-[#9A948C]">Quantité</p>
          <Stepper qty={qty} onChange={(v) => setQty(Math.max(1, v))} />
        </div>
      </div>

      <div className="fixed bottom-0 left-0 right-0 z-20 mx-auto flex max-w-[400px] items-center gap-3 bg-white px-5 py-4 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
        <button onClick={handleAdd} disabled={!valid} className="flex-1 rounded-2xl py-3.5 text-sm font-bold text-white transition disabled:opacity-30" style={{background: INK}}>
          Ajouter à la commande — {FCFA(unitPrice * qty)}
        </button>
      </div>
    </div>
  );
}

function OrderScreen({ onBack, onCheckout }) {
  const { lines, updateQty, subtotal } = useCart();
  return (
    <div className="pb-28">
      <TopBar title="Ma commande" onBack={onBack} />
      <div className="px-5 pt-2">
        {lines.length === 0 ? (
          <p className="mt-16 text-center text-sm text-[#9A948C]">Votre commande est vide.</p>
        ) : (
          <div className="space-y-3">
            {lines.map(l => (
              <div key={l.lineId} className="flex items-center gap-3 rounded-2xl bg-white p-3 ring-1 ring-black/5">
                <div className="flex h-14 w-14 flex-shrink-0 items-center justify-center rounded-xl text-2xl" style={{background: "#FFF1E9"}}>🍽</div>
                <div className="min-w-0 flex-1">
                  <p className="truncate text-sm font-semibold text-[#181411]">{l.name}</p>
                  {l.meta && <p className="truncate text-xs text-[#9A948C]">{l.meta}</p>}
                  <p className="text-xs font-bold" style={{color: ORANGE}}>{FCFA(l.unitPrice)}</p>
                </div>
                <Stepper qty={l.qty} onChange={(v) => updateQty(l.lineId, v)} size="sm" />
              </div>
            ))}
          </div>
        )}

        {lines.length > 0 && (
          <div className="mt-5 space-y-1 rounded-2xl bg-white p-4 ring-1 ring-black/5">
            <div className="flex justify-between text-sm text-[#9A948C]"><span>Sous-total</span><span>{FCFA(subtotal)}</span></div>
            <p className="pt-1 text-[11px] text-[#9A948C]">Livraison calculée à l'étape suivante</p>
          </div>
        )}
      </div>

      {lines.length > 0 && (
        <div className="fixed bottom-0 left-0 right-0 z-20 mx-auto flex max-w-[400px] items-center justify-between gap-3 bg-white px-5 py-4 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
          <button onClick={onCheckout} className="flex w-full items-center justify-between rounded-2xl px-5 py-3.5 text-sm font-bold text-white" style={{background: INK}}>
            <span>Passer la commande</span>
            <span>{FCFA(subtotal)}</span>
          </button>
        </div>
      )}
    </div>
  );
}

function Checkout({ onBack }) {
  const { lines, subtotal, clearCart } = useCart();
  const [customer, setCustomer] = useState({ name: "", phone: "", zoneId: MENU.deliveryZones[0].id });
  const [error, setError] = useState("");
  const zone = MENU.deliveryZones.find(z => z.id === customer.zoneId);
  const total = subtotal + (zone ? zone.fee : 0);
  const canSubmit = customer.name.trim() && customer.phone.trim();

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!canSubmit) { setError("Merci de renseigner votre nom et votre numéro."); return; }
    setError("");
    sendOrderToWhatsApp({ lines, customer, subtotal });
    clearCart(); onBack();
  };

  return (
    <div className="pb-28">
      <TopBar title="Livraison" onBack={onBack} />
      <form onSubmit={handleSubmit} className="space-y-4 px-5 pt-2">
        <div>
          <label className="mb-1 block text-xs font-bold uppercase tracking-wide text-[#9A948C]">Nom</label>
          <input value={customer.name} onChange={e => setCustomer({ ...customer, name: e.target.value })} placeholder="Jean Dupont" className="w-full rounded-xl border border-[#EFEAE3] bg-white px-4 py-3 text-sm outline-none" />
        </div>
        <div>
          <label className="mb-1 block text-xs font-bold uppercase tracking-wide text-[#9A948C]">Téléphone</label>
          <input value={customer.phone} onChange={e => setCustomer({ ...customer, phone: e.target.value })} placeholder="+242 06 XXX XX XX" className="w-full rounded-xl border border-[#EFEAE3] bg-white px-4 py-3 text-sm outline-none" />
        </div>
        <div>
          <label className="mb-1 block text-xs font-bold uppercase tracking-wide text-[#9A948C]">Quartier</label>
          <div className="space-y-2">
            {MENU.deliveryZones.map(z => (
              <button key={z.id} type="button" onClick={() => setCustomer({ ...customer, zoneId: z.id })} className="flex w-full items-center justify-between rounded-xl border px-4 py-3 text-sm"
                style={customer.zoneId === z.id ? {borderColor: ORANGE, background: "#FFF1E9"} : {borderColor: "#EFEAE3", background: "#FFF"}}>
                <span className="font-medium text-[#181411]">{z.label}</span>
                <span className="font-semibold" style={{color: ORANGE}}>{FCFA(z.fee)}</span>
              </button>
            ))}
          </div>
        </div>
        {error && <p className="text-xs font-medium text-red-500">{error}</p>}

        <div className="space-y-1 rounded-2xl bg-white p-4 ring-1 ring-black/5">
          <div className="flex justify-between text-sm text-[#9A948C]"><span>Sous-total</span><span>{FCFA(subtotal)}</span></div>
          <div className="flex justify-between text-sm text-[#9A948C]"><span>Livraison</span><span>{FCFA(zone.fee)}</span></div>
          <div className="flex justify-between border-t border-[#F1ECE4] pt-1 font-display text-base font-extrabold text-[#181411]"><span>Total</span><span>{FCFA(total)}</span></div>
        </div>

        <div className="fixed bottom-0 left-0 right-0 z-20 mx-auto max-w-[400px] bg-white px-5 py-4 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
          <button type="submit" disabled={!canSubmit} className="w-full rounded-2xl py-3.5 text-sm font-bold text-white transition disabled:opacity-30" style={{background: INK}}>
            Confirmer via WhatsApp — {FCFA(total)}
          </button>
        </div>
      </form>
    </div>
  );
}

function App() {
  const [view, setView] = useState("home");
  const [selected, setSelected] = useState(null);

  return (
    <div className="phone">
      {view === "home" && <Home onOpenItem={(i) => { setSelected(i); setView("detail"); }} onOpenCart={() => setView("order")} />}
      {view === "detail" && <Detail item={selected} onBack={() => setView("home")} onAdded={() => setView("home")} />}
      {view === "order" && <OrderScreen onBack={() => setView("home")} onCheckout={() => setView("checkout")} />}
      {view === "checkout" && <Checkout onBack={() => setView("order")} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CartProvider><App /></CartProvider>);
</script>
</body>
</html>
