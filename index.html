<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F5EFEB" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/Logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- SEO Meta Tags -->
    <title>GirondeSphere - Commandez vos repas favoris</title>
    <meta name="description" content="Commandez vos repas préférés chez GirondeSphere directement via WhatsApp. Rapide, simple et délicieux." />
    <meta name="keywords" content="fast food, gironde, sphere, repas, livraison, commande, whatsapp, restaurant" />
    
    <!-- Open Graph (Facebook, WhatsApp, Instagram) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gironde-sphere.vercel.app/" />
    <meta property="og:title" content="GirondeSphere - Fast Food" />
    <meta property="og:description" content="Commandez vos repas préférés via WhatsApp avec GirondeSphere." />
    <meta property="og:image" content="/assets/Logo.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.backgroundColor = 'red';
        errorDiv.style.color = 'white';
        errorDiv.style.padding = '20px';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.fontSize = '12px';
        errorDiv.innerHTML = '<b>Error:</b> ' + event.message + '<br/>' + event.filename + ':' + event.lineno;
        document.body.appendChild(errorDiv);
      });
      window.addEventListener('unhandledrejection', function(event) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.bottom = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.backgroundColor = 'orange';
        errorDiv.style.color = 'white';
        errorDiv.style.padding = '20px';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.fontSize = '12px';
        errorDiv.innerHTML = '<b>Promise Error:</b> ' + (event.reason ? event.reason.message : 'Unknown');
        document.body.appendChild(errorDiv);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
